name: Build Android APK
on:
  push:
    branches: ["android-resident-monitor", "main"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the current Android version"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Read Android version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Name APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "HTRAM-Monitor-v${{ steps.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HTRAM-Monitor-v${{ steps.version.outputs.version }}
          path: HTRAM-Monitor-v${{ steps.version.outputs.version }}.apk
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" "HTRAM-Monitor-v${{ steps.version.outputs.version }}.apk" \
            --title "HTRAM Monitor v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest
